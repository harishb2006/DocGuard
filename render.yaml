services:
  # Backend - FastAPI Python Server
  - type: web
    name: docguard-api
    runtime: python
    region: oregon
    rootDir: server
    pythonVersion: "3.12.0"  # Required for langchain-pinecone compatibility
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false  # Paste your Firebase JSON here in dashboard
    healthCheckPath: /

  # Frontend - React/Vite Static Site
  - type: web
    name: docguard-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://docguard-api.onrender.com  # Update with your actual backend URL
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
